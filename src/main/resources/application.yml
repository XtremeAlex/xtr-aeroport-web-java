server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /xtr-aeroport
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: xtr-aeroport-web-java
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  thymeleaf:
    cache: true          # produzione: cache attiva
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 256KB
  jmx:
    enabled: false

# Endpoint dell'API interna (ClusterIP nel cluster; localhost in locale)
aeroport:
  web:
    # Dominio pubblico di produzione: usato per canonical, hreflang, Open Graph e sitemap.
    # Sovrascrivibile via AEROPORT_PUBLIC_BASE_URL (NON include il context-path).
    public-base-url: ${AEROPORT_PUBLIC_BASE_URL:https://aeroport.bubume.it}
  api:
    base-url: ${AEROPORT_API_BASE_URL:http://localhost:8080/xtr-aeroport-api}
    connect-timeout-ms: ${AEROPORT_API_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AEROPORT_API_READ_TIMEOUT_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.xtremealex: INFO
