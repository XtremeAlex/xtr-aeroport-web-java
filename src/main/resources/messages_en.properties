home.section.tools=What you can do
home.tool.decode.title=Decode
home.tool.decode.desc=Paste or upload a PAXLST message: we turn it into readable flights and passenger lists, with a segment inspector and error diagnostics.
home.tool.decode.cta=Go to decode
home.tool.encode.title=Encode
home.tool.encode.desc=Fill in a form with the flight and its passengers and get a valid PAXLST message, ready to send.
home.tool.encode.cta=Go to create

