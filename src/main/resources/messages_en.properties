home.section.trust=How we handle your data
home.trust.privacy.title=No persistence
home.trust.privacy.desc=This interface does not store the messages you decode or create: data stays in memory only for the duration of the request and is never written to disk or shared with third parties.
home.trust.open.title=Open source
home.trust.open.desc=The code is public and auditable. You can inspect it, adapt it and host it yourself.
home.trust.local.title=Processing close to the data
home.trust.local.desc=The engine is designed to run on modest resources, even on a Raspberry Pi, inside your own network.

