# --- Home / product showcase ---
home.title=Aeroport · EDIFACT PAXLST engine
home.hero.eyebrow=EDIFACT PAXLST engine
home.hero.title=Decode and build PAXLST messages, in plain sight.
home.hero.subtitle=A tool to read, validate and compose the EDIFACT/PAXLST passenger lists used in aviation — no spreadsheets, and without sending your data to external services.
home.hero.ctaDecode=Decode a message
home.hero.ctaEncode=Create a message
home.hero.badgePrivacy=No data stored
