legal.opensource.body=This software is open source: the source code is public, auditable and self-hostable. It is distributed under the licence stated in the repository. You are free to study and adapt it in accordance with the licence terms.
legal.usage.title=Acceptable use
legal.usage.body=The tool processes data that may include passengers' personal information. Use it only on data you are legally entitled to handle and in compliance with the applicable data protection regulations. For misuse or reports, contact the address listed in the project repository.


