legal.privacy.title=Privacy
legal.privacy.body=Questa interfaccia web non conserva i messaggi EDIFACT che decodifichi o crei. I dati inviati vengono elaborati in memoria per rispondere alla richiesta e non sono scritti su disco né trasmessi a terze parti. Le uniche informazioni salvate nel tuo browser sono le preferenze tecniche di lingua e tema.
legal.opensource.title=Open source & licenza
legal.opensource.body=Questo software è open source: il codice sorgente è pubblico, ispezionabile e ospitabile in autonomia. È distribuito secondo la licenza indicata nel repository. Sei libero di studiarlo e adattarlo nel rispetto dei termini di licenza.
legal.usage.title=Uso corretto
legal.usage.body=Lo strumento tratta dati che possono includere informazioni personali di passeggeri. Usalo solo su dati per cui hai un titolo legittimo e nel rispetto delle normative applicabili sulla protezione dei dati. In caso di uso improprio o segnalazioni, scrivi al contatto indicato nel repository del progetto.


