<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="it">
<head th:replace="~{fragments/layout :: head(${title} ?: #{seo.error.title}, #{seo.error.desc})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1 th:text="${title}">Servizio non disponibile</h1>
    <p class="empty" th:text="${message}">Impossibile contattare l'API.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
